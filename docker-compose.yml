services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
    depends_on:
      - backend
  
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
    working_dir: /app
    environment:
      DATABASE_URL: mysql+mysqlconnector://${MYSQL_USER:-allegrocode}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@db:3306/${MYSQL_DATABASE:-allegrocode}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:?Set YANDEX_FOLDER_ID in .env}
      YANDEX_API_KEY: ${YANDEX_API_KEY:?Set YANDEX_API_KEY in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      STABILITY_API_KEY: ${STABILITY_API_KEY:-}
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-allegrocode}
      MYSQL_USER: ${MYSQL_USER:-allegrocode}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
